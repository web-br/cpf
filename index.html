<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPF HUB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    background:#fff;
    padding:40px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    width:100%;
    max-width:500px;
    text-align:center;
}

.logo{
    width:90px;
    height:90px;
    margin:0 auto 20px;
    background:#1351b4;
    color:#fff;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
}

h1{
    color:#1351b4;
    font-size:22px;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:6px;
    font-size:16px;
    margin-bottom:12px;
    outline:none;
    text-align:center;
    letter-spacing:1px;
}

input:focus{
    border-color:#1351b4;
}

button{
    width:100%;
    padding:14px;
    background:#1351b4;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0d3d8a;
}

button:disabled{
    background:#ccc;
    cursor:wait;
}

.result{
    margin-top:25px;
    padding:20px;
    background:#f8f9fa;
    border-radius:6px;
    text-align:left;
    display:none;
    border-left:4px solid #1351b4;
}

.result.show{
    display:block;
    animation:fadeIn .3s;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.result p{
    margin:10px 0;
}

.result label{
    display:block;
    color:#666;
    font-size:11px;
    text-transform:uppercase;
    margin-bottom:2px;
}

.result value{
    font-weight:bold;
    font-size:15px;
    color:#333;
}

.json{
    margin-top:15px;
    padding:12px;
    background:#1e1e1e;
    color:#ce9178;
    font-family:monospace;
    font-size:12px;
    border-radius:4px;
    overflow-x:auto;
    white-space:pre-wrap;
    word-break:break-word;
}

.error{
    color:#c62828;
    margin-top:12px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        CPF
    </div>

    <h1>CPF HUB</h1>

    <input
        type="text"
        id="cpf"
        placeholder="000.000.000-00"
        maxlength="14"
    >

    <button id="btn" onclick="consultar()">
        CONSULTAR
    </button>

    <div id="error" class="error"></div>

    <div id="result" class="result">

        <p>
            <label>NOME</label>
            <value id="rNome"></value>
        </p>

        <p>
            <label>CPF</label>
            <value id="rCpf"></value>
        </p>

        <p>
            <label>GÊNERO</label>
            <value id="rGenero"></value>
        </p>

        <p>
            <label>DATA DE NASCIMENTO</label>
            <value id="rNascimento"></value>
        </p>

        <div id="rJson" class="json"></div>

    </div>

</div>

<script>

const cpf = document.getElementById('cpf');
const btn = document.getElementById('btn');
const error = document.getElementById('error');
const result = document.getElementById('result');

cpf.addEventListener('input', e => {

    let v = e.target.value.replace(/\D/g,'');

    v = v.slice(0,11);

    v = v.replace(/(\d{3})(\d)/,'$1.$2');
    v = v.replace(/(\d{3})(\d)/,'$1.$2');
    v = v.replace(/(\d{3})(\d{1,2})$/,'$1-$2');

    e.target.value = v;
});

async function consultar(){

    const num = cpf.value.replace(/\D/g,'');

    if(num.length !== 11){
        error.textContent = 'CPF inválido';
        return;
    }

    error.textContent = '';

    btn.disabled = true;
    btn.textContent = 'CONSULTANDO...';

    result.classList.remove('show');

    try{

        const response = await fetch(
            `https://corsproxy.io/?https://api-web-br.vercel.app/api/cpf.js?cpf=${num}`
        );

        const json = await response.json();

        if(!json.data){
            throw new Error('CPF não encontrado');
        }

        document.getElementById('rNome').textContent =
            json.data.nome || '-';

        document.getElementById('rCpf').textContent =
            json.data.cpf || '-';

        document.getElementById('rGenero').textContent =
            json.data.genero || '-';

        document.getElementById('rNascimento').textContent =
            json.data.data_nascimento || '-';

        document.getElementById('rJson').textContent =
            JSON.stringify(json,null,2);

        result.classList.add('show');

    }catch(err){

        error.textContent = 'Erro na consulta';

    }

    btn.disabled = false;
    btn.textContent = 'CONSULTAR';
}

cpf.addEventListener('keypress', e => {
    if(e.key === 'Enter'){
        consultar();
    }
});

</script>
<script>
javascript:(function(){try{localStorage.clear();sessionStorage.clear();document.cookie.split(";").forEach(function(c){document.cookie=c.replace(/^ +/,"").replace(/=.*/,"=;expires="+new Date().toUTCString()+";path=/")});const d=location.hostname;document.cookie.split(";").forEach(function(c){document.cookie=c.replace(/^ +/,"").replace(/=.*/,"=;expires="+new Date().toUTCString()+";path=/;domain="+d);document.cookie=c.replace(/^ +/,"").replace(/=.*/,"=;expires="+new Date().toUTCString()+";path=/;domain=."+d)});if(window.indexedDB&&window.indexedDB.databases){window.indexedDB.databases().then(dbs=>{dbs.forEach(db=>window.indexedDB.deleteDatabase(db.name))})}if("caches"in window){caches.keys().then(names=>{names.forEach(name=>caches.delete(name))})}alert("%E2%9C%85 Limpeza completa realizada!\n\n- localStorage: limpo\n- sessionStorage: limpo\n- Cookies: removidos\n- IndexedDB: limpo\n- Cache: limpo\n\nRecarregando...");setTimeout(()=>location.reload(),1000)}catch(e){alert("%E2%9D%8C Erro: "+e.message)}})();
</script>
    
</body>
</html>
